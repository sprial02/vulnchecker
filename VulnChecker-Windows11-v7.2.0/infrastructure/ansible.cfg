[defaults]
inventory = inventory/hosts.yml
collections_path = ./collections
callback_plugins = ./plugins/callback
filter_plugins = ./plugins/filter
callbacks_enabled = infra_status
retry_files_enabled = False
host_key_checking = True
forks = 5
timeout = 30
task_timeout = 120
display_args_to_stdout = False

[ssh_connection]
pipelining = True
retries = 0
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=2
